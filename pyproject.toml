[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignment-selection-dynamics"
version = "0.2.0rc1"
description = "Controlled evolutionary experiments on when alignment-linked verifier traits are selected for or optimized away."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "torch>=2.6,<3",
  "numpy>=2.0,<3",
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.urls]
Homepage = "https://www.sylvesterkaczmarek.com"
Repository = "https://github.com/sylvesterkaczmarek/alignment-selection-dynamics"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["alignment_selection_dynamics*", "experiments*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["F"]
