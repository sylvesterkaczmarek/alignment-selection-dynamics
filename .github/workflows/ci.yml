name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPLBACKEND: Agg
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -m pip check
      - run: python -m ruff check src experiments scripts tests
      - run: python -m pytest -q
      - run: python -m experiments.verify_factorial results/factorial-validation-v2
      - name: Independent boundary-learning and arithmetic reference
        if: matrix.python == '3.13'
        run: python scripts/independent_reference.py results/factorial-validation-v2
      - name: Execute complete small factorial
        if: matrix.python == '3.13'
        run: |
          python -m experiments.causal_factorial --config configs/smoke.yaml --prefix 1 --challenge 1 --split-shift --out '${{ runner.temp }}/factorial-smoke'
          python -m experiments.verify_factorial '${{ runner.temp }}/factorial-smoke'
          python -m experiments.showcase --out '${{ runner.temp }}/factorial-showcase'
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m experiments.verify_factorial results/factorial-validation-v2
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --disable-pip --no-deps -r requirements-reference.txt
  package:
    name: Verify installed candidate
    needs: [test, macos, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/verify_distribution.py dist/*.whl dist/*.tar.gz --report proof/distribution.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate
          path: |
            dist/*
            proof/*
          if-no-files-found: error
          retention-days: 30
